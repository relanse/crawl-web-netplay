[Service]
Environment=CRAWL_AUTHORITY_EXE=/opt/crawl-online/current/authority/CrawlServer.x86_64
Environment=CRAWL_CLIENT_DIRECTORY=/opt/crawl-online/current/client
Environment=CRAWL_MATCH_DIRECTORY=/var/lib/crawl-online/matches
ExecStart=
ExecStart=/usr/bin/xvfb-run -a -s "-screen 0 640x360x24 -nolisten tcp" /opt/crawl-online/runtime/node --preserve-symlinks-main --max-old-space-size=128 /opt/crawl-online/current/server/online-server.mjs
